<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1번 4방향 팔 검토</title>
<style>body{margin:20px;background:#e4e9dc;color:#28352c;font:16px system-ui}h1{font-size:24px}button,select{font:inherit;padding:9px}main{display:flex;gap:36px;align-items:end}.sprite{background:url(walk.png);background-size:400% 400%}.selection{width:96px;height:144px}.game{width:48px;height:72px}img{max-width:100%;height:auto}a{color:#254938}</style>
<h1>1번 팔 · 4방향 검토</h1><p>정면 v2 유지, 측면·후면 독립 원화. 운영 미적용.</p><label>방향 <select id="direction"><option value="0">정면</option><option value="1">왼쪽</option><option value="2">오른쪽</option><option value="3">후면</option></select></label> <button id="play">보행 재생</button>
<main><section><p>96×144</p><div class="sprite selection"></div></section><section><p>48×72</p><div class="sprite game"></div></section></main><p id="frame"></p>
<p><a href="contact-sheet.png">고해상도 16프레임 검수표</a></p><p>위: 기존 / 아래: 수정</p><img src="comparison.png" alt="4방향 기존과 수정본 비교">
<script>let active=false,i=1,row=0;const b=document.querySelector('#play'),sprites=[...document.querySelectorAll('.sprite')];function draw(){sprites.forEach(e=>e.style.backgroundPosition=(i/3*100)+'% '+(row/3*100)+'%');document.querySelector('#frame').textContent=(i+1)+'번 프레임';}document.querySelector('#direction').onchange=e=>{row=Number(e.target.value);draw();};b.onclick=()=>{active=!active;b.textContent=active?'정지':'보행 재생';if(!active){i=1;draw();}};setInterval(()=>{if(active){i=(i+1)%4;draw();}},180);draw();</script></html>
