name: Real Android Chrome visual regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-chrome-visual.yml"
      - "client/**"
      - "character-assets/**"
      - "map-assets/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  actions: read
  contents: read

concurrency:
  group: android-chrome-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Restore shared quality dependencies
        uses: ./.github/actions/setup-quality-dependencies
        with:
          node-version: 24
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the Android Chrome automation bridge
        run: |
          npm install --global appium@3
          appium driver install uiautomator2
          appium --version
      - name: Restore commit-matched device build
        id: quality-build
        uses: ./.github/actions/restore-quality-build
        with:
          variant: device
          target-sha: ${{ github.sha }}
          github-token: ${{ github.token }}
      - name: Build device client locally when shared artifact is unavailable
        if: steps.quality-build.outputs.restored != 'true'
        run: |
          pnpm characters:generate
          pnpm --filter @wedding-game/shared build
          VITE_WORKER_URL=https://example.invalid VITE_INVITATION_ID=device-pwa-audit pnpm --filter @wedding-game/client build
      - name: Start deterministic invitation server and Appium
        shell: bash
        run: |
          pnpm --filter @wedding-game/client exec vite --host 0.0.0.0 --port 4179 --strictPort > "$RUNNER_TEMP/android-chrome-vite.log" 2>&1 &
          echo "VITE_PID=$!" >> "$GITHUB_ENV"
          pnpm --filter @wedding-game/client exec vite preview --host 0.0.0.0 --port 4188 --strictPort > "$RUNNER_TEMP/android-chrome-pwa-preview.log" 2>&1 &
          echo "PWA_PREVIEW_PID=$!" >> "$GITHUB_ENV"
          appium --base-path /wd/hub --port 4725 \
            --allow-insecure uiautomator2:chromedriver_autodownload \
            --log "$RUNNER_TEMP/android-chrome-appium.log" > /dev/null 2>&1 &
          echo "APPIUM_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4179/ > /dev/null \
              && curl --fail --silent http://127.0.0.1:4188/ > /dev/null \
              && curl --fail --silent http://127.0.0.1:4725/wd/hub/status > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/android-chrome-vite.log"
          cat "$RUNNER_TEMP/android-chrome-pwa-preview.log"
          cat "$RUNNER_TEMP/android-chrome-appium.log"
          exit 1
      - name: Capture and compare real Android Chrome
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell pm path com.android.chrome
            adb shell dumpsys package com.android.chrome | grep versionName | head -n 1
            adb reverse tcp:4188 tcp:4188
            ANDROID_EMULATOR_SERIAL=emulator-5554 pnpm visual:android-chrome -- --mode auto --url http://10.0.2.2:4179/ --pwa-url http://127.0.0.1:4188/ --preview-host-url http://127.0.0.1:4188/ --appium-url http://127.0.0.1:4725/wd/hub
      - name: Stop invitation server
        if: always()
        shell: bash
        run: |
          if test -n "${VITE_PID:-}"; then kill "$VITE_PID" 2>/dev/null || true; fi
          if test -n "${PWA_PREVIEW_PID:-}"; then kill "$PWA_PREVIEW_PID" 2>/dev/null || true; fi
          if test -n "${APPIUM_PID:-}"; then kill "$APPIUM_PID" 2>/dev/null || true; fi
      - name: Package content-addressed Android quality evidence
        if: always()
        run: node scripts/pack-content-addressed-quality-evidence.mjs --input-dir .superpowers/visual-regression/android-chrome --output-dir .quality-artifacts/android-chrome --exclude-suffix=-diff.png
      - name: Upload real Android Chrome evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-chrome-visual-${{ github.run_id }}
          path: |
            .quality-artifacts/android-chrome
            ${{ runner.temp }}/android-chrome-vite.log
            ${{ runner.temp }}/android-chrome-pwa-preview.log
            ${{ runner.temp }}/android-chrome-appium.log
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 9
          retention-days: 7
      - name: Upload failed Android Chrome visual differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-chrome-diff-${{ github.run_id }}
          path: .superpowers/visual-regression/android-chrome/**/*-diff.png
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 14
