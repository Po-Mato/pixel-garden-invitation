name: Release quality summary

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Mobile visual regression]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: release-quality-summary-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Gate on all four same-commit release workflows
        id: release-gate
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          node scripts/check-release-workflow-readiness.mjs \
            --target-sha "$TARGET_SHA" \
            --current-run-id "$GITHUB_RUN_ID" \
            --wait-timeout-ms 2700000 \
            --poll-interval-ms 20000
      - uses: pnpm/action-setup@v6
        if: steps.release-gate.outputs.should_summarize == 'true'
        with:
          version: 10.29.2
      - name: Restore release quality history
        if: steps.release-gate.outputs.should_summarize == 'true'
        uses: actions/cache/restore@v5
        with:
          path: |
            .superpowers/visual-regression/release-quality-summary/release-quality-history.json
            .superpowers/visual-regression/release-quality-summary/visual-diff-calibration-history.json
            .superpowers/visual-regression/release-quality-summary/quality-ci-efficiency-history.json
            .superpowers/visual-regression/release-quality-summary/quality-evidence-efficiency-history.json
          key: release-quality-history-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            release-quality-history-${{ runner.os }}-
      - name: Seed release and engine calibration history from recent successful summaries
        if: ${{ steps.release-gate.outputs.should_summarize == 'true' && (hashFiles('.superpowers/visual-regression/release-quality-summary/release-quality-history.json') == '' || hashFiles('.superpowers/visual-regression/release-quality-summary/visual-diff-calibration-history.json') == '' || hashFiles('.superpowers/visual-regression/release-quality-summary/quality-ci-efficiency-history.json') == '' || hashFiles('.superpowers/visual-regression/release-quality-summary/quality-evidence-efficiency-history.json') == '') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          mkdir -p quality-history-seed
          gh run list --workflow release-quality-summary.yml --status success --limit 10 --json databaseId,headSha \
            --jq ".[] | select(.headSha != \"$TARGET_SHA\") | .databaseId" \
            | while read -r previous_run_id; do
                test -n "$previous_run_id" || continue
                gh run download "$previous_run_id" --pattern 'release-quality-summary-*' --dir "quality-history-seed/$previous_run_id" || true
              done
          pnpm quality:summary-seed -- --input-dir quality-history-seed
      - name: Download same-commit quality evidence and intentional cold samples
        if: steps.release-gate.outputs.should_summarize == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          PAGES_RUN_ID: ${{ steps.release-gate.outputs.pages_run_id }}
          MOBILE_RUN_ID: ${{ steps.release-gate.outputs.mobile_run_id }}
          ANDROID_RUN_ID: ${{ steps.release-gate.outputs.android_run_id }}
          IOS_RUN_ID: ${{ steps.release-gate.outputs.ios_run_id }}
        run: |
          mkdir -p quality-inputs
          download_artifact() {
            local run_id="$1"
            local pattern="$2"
            local destination="$3"
            if test -n "$run_id"; then
              gh run download "$run_id" --pattern "$pattern" --dir "$destination" || true
            fi
          }
          download_artifact "$PAGES_RUN_ID" 'pwa-cache-asset-change' quality-inputs/pages
          download_artifact "$PAGES_RUN_ID" 'production-network-pwa-canary' quality-inputs/pages
          download_artifact "$PAGES_RUN_ID" 'production-large-text-canary' quality-inputs/pages
          download_artifact "$PAGES_RUN_ID" "quality-ci-efficiency-pages-$PAGES_RUN_ID" quality-inputs/ci/pages
          download_artifact "$MOBILE_RUN_ID" "map-diagnostics-browser-$MOBILE_RUN_ID" quality-inputs/mobile
          download_artifact "$MOBILE_RUN_ID" "mobile-hud-browser-$MOBILE_RUN_ID" quality-inputs/mobile
          download_artifact "$MOBILE_RUN_ID" "mobile-device-soak-$MOBILE_RUN_ID" quality-inputs/mobile
          download_artifact "$MOBILE_RUN_ID" "mobile-visual-region-report-$MOBILE_RUN_ID" quality-inputs/mobile
          download_artifact "$MOBILE_RUN_ID" "quality-ci-efficiency-mobile-$MOBILE_RUN_ID" quality-inputs/ci/mobile
          download_artifact "$ANDROID_RUN_ID" "android-chrome-visual-$ANDROID_RUN_ID" quality-inputs/android
          download_artifact "$ANDROID_RUN_ID" "quality-ci-efficiency-android-$ANDROID_RUN_ID" quality-inputs/ci/android
          download_artifact "$IOS_RUN_ID" "ios-safari-visual-$IOS_RUN_ID" quality-inputs/ios
          download_artifact "$IOS_RUN_ID" "quality-ci-efficiency-ios-$IOS_RUN_ID" quality-inputs/ci/ios
          record_run_timing() {
            local workflow="$1"
            local run_id="$2"
            local runner_os="$3"
            if test -n "$run_id"; then
              node scripts/record-quality-ci-run-timing.mjs \
                --workflow "$workflow" \
                --run-id "$run_id" \
                --runner-os "$runner_os" \
                --output-dir quality-inputs/ci/timings
            fi
          }
          record_run_timing pages "$PAGES_RUN_ID" linux
          record_run_timing mobile "$MOBILE_RUN_ID" linux
          record_run_timing android "$ANDROID_RUN_ID" linux
          record_run_timing ios "$IOS_RUN_ID" macos
          {
            gh run list --workflow quality-build.yml --event schedule --status success --limit 6 --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$TARGET_SHA\") | .databaseId"
            gh run list --workflow quality-build.yml --event workflow_dispatch --status success --limit 30 --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$TARGET_SHA\") | .databaseId"
          } | sort -u \
            | while read -r cold_run_id; do
                test -n "$cold_run_id" || continue
                has_cold_artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$cold_run_id/artifacts" \
                  --jq "[.artifacts[] | select(.name == \"quality-ci-intentional-cold-$cold_run_id\" and (.expired | not))] | length")"
                if test "$has_cold_artifact" -gt 0; then
                  download_artifact "$cold_run_id" "quality-ci-intentional-cold-$cold_run_id" "quality-inputs/ci/cold/$cold_run_id"
                  cold_report="$(find "quality-inputs/ci/cold/$cold_run_id" -name quality-ci-efficiency-cold-sample.json -print -quit)"
                  if test -n "$cold_report" && test "$(jq -r '.releaseSha // .sha // ""' "$cold_report")" = "$TARGET_SHA"; then
                    record_run_timing cold-sample "$cold_run_id" linux
                  else
                    rm -f "$cold_report"
                  fi
                fi
              done
      - name: Summarize dependency cache and shared-build efficiency
        if: steps.release-gate.outputs.should_summarize == 'true'
        run: pnpm quality:ci-efficiency -- --input-dir quality-inputs --repository-visibility "$REPOSITORY_VISIBILITY"
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility || 'public' }}
      - name: Track content-addressed evidence savings and leak budgets
        if: steps.release-gate.outputs.should_summarize == 'true'
        run: pnpm quality:evidence-efficiency -- --input-dir quality-inputs --sha "${{ github.event.workflow_run.head_sha || github.sha }}"
      - name: Build checksum-bound artifact manifest
        if: steps.release-gate.outputs.should_summarize == 'true'
        run: pnpm quality:artifact-manifest -- --input-dir quality-inputs
      - name: Build release quality summary
        if: steps.release-gate.outputs.should_summarize == 'true'
        run: pnpm quality:summary -- --input-dir quality-inputs --sha "${{ github.event.workflow_run.head_sha || github.sha }}"
      - name: Save release quality history
        if: ${{ always() && steps.release-gate.outputs.should_summarize == 'true' && hashFiles('.superpowers/visual-regression/release-quality-summary/release-quality-history.json') != '' && hashFiles('.superpowers/visual-regression/release-quality-summary/visual-diff-calibration-history.json') != '' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .superpowers/visual-regression/release-quality-summary/release-quality-history.json
            .superpowers/visual-regression/release-quality-summary/visual-diff-calibration-history.json
            .superpowers/visual-regression/release-quality-summary/quality-ci-efficiency-history.json
            .superpowers/visual-regression/release-quality-summary/quality-evidence-efficiency-history.json
          key: release-quality-history-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload release quality summary
        if: ${{ always() && steps.release-gate.outputs.should_summarize == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-quality-summary-${{ github.run_id }}
          path: .superpowers/visual-regression/release-quality-summary
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
