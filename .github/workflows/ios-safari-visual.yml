name: Real iOS Safari visual regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-safari-visual.yml"
      - "client/**"
      - "character-assets/**"
      - "map-assets/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: ios-safari-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.2
      - uses: actions/setup-node@v6
        with:
          # Node 24 undici can intermittently raise setTypeOfService EINVAL on macOS runners.
          node-version: 22
          cache: pnpm
      - name: Select pinned Xcode and warm Simulator services
        shell: bash
        run: |
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_16.4*.app' | sort | head -n 1)"
          test -n "$XCODE_APP"
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun simctl list > /dev/null
          IOS_SIMULATOR_UDID="$(xcrun simctl list devices available --json | jq -r '.devices | to_entries[] | select(.key | contains("iOS-18-5")) | .value[] | select(.name == "iPhone 16 Pro") | .udid' | head -n 1)"
          test -n "$IOS_SIMULATOR_UDID"
          echo "IOS_SIMULATOR_UDID=$IOS_SIMULATOR_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$IOS_SIMULATOR_UDID"
          xcrun simctl bootstatus "$IOS_SIMULATOR_UDID" -b
      - run: pnpm install --frozen-lockfile
      - name: Install the iOS Safari automation bridge
        run: |
          npm install --global appium@3
          appium driver install xcuitest
          appium --version
      - name: Start deterministic invitation server
        shell: bash
        run: |
          pnpm characters:generate
          pnpm --filter @wedding-game/shared build
          VITE_WORKER_URL=https://example.invalid VITE_INVITATION_ID=device-pwa-audit pnpm --filter @wedding-game/client build
          pnpm --filter @wedding-game/client exec vite --host 0.0.0.0 --port 4178 --strictPort > "$RUNNER_TEMP/ios-safari-vite.log" 2>&1 &
          echo "VITE_PID=$!" >> "$GITHUB_ENV"
          pnpm --filter @wedding-game/client exec vite preview --host 0.0.0.0 --port 4188 --strictPort > "$RUNNER_TEMP/ios-safari-pwa-preview.log" 2>&1 &
          echo "PWA_PREVIEW_PID=$!" >> "$GITHUB_ENV"
          appium --base-path /wd/hub --port 4723 --log "$RUNNER_TEMP/ios-safari-appium.log" > /dev/null 2>&1 &
          echo "APPIUM_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4178/ > /dev/null \
              && curl --fail --silent http://127.0.0.1:4188/ > /dev/null \
              && curl --fail --silent http://127.0.0.1:4723/wd/hub/status > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ios-safari-vite.log"
          cat "$RUNNER_TEMP/ios-safari-pwa-preview.log"
          exit 1
      - name: Capture and compare real Mobile Safari
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if xcrun simctl openurl "$IOS_SIMULATOR_UDID" http://127.0.0.1:4178/; then
              break
            fi
            test "$attempt" -lt 3
            xcrun simctl bootstatus "$IOS_SIMULATOR_UDID" -b
            sleep 3
          done
          sleep 3
          pnpm visual:ios-safari -- --mode auto --url http://127.0.0.1:4178/ --pwa-url http://127.0.0.1:4188/ --preview-host-url http://127.0.0.1:4188/
      - name: Stop invitation server
        if: always()
        shell: bash
        run: |
          if test -n "${VITE_PID:-}"; then kill "$VITE_PID" 2>/dev/null || true; fi
          if test -n "${PWA_PREVIEW_PID:-}"; then kill "$PWA_PREVIEW_PID" 2>/dev/null || true; fi
          if test -n "${APPIUM_PID:-}"; then kill "$APPIUM_PID" 2>/dev/null || true; fi
      - name: Upload real iOS Safari evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-safari-visual-${{ github.run_id }}
          path: |
            .superpowers/visual-regression/ios-safari
            ${{ runner.temp }}/ios-safari-vite.log
            ${{ runner.temp }}/ios-safari-pwa-preview.log
            ${{ runner.temp }}/ios-safari-appium.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
