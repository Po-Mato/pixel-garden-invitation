name: Real iOS Safari visual regression

on:
  workflow_dispatch:
    inputs:
      compositor_fault_injection:
        description: Deterministic native compositor recovery drill
        required: false
        default: none
        type: choice
        options:
          - none
          - activate-refresh
          - recreate-session
  schedule:
    - cron: "17 3 * * 1"
    - cron: "47 4 1 * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-safari-visual.yml"
      - "client/**"
      - "character-assets/**"
      - "map-assets/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  actions: read
  contents: read

concurrency:
  group: ios-safari-visual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Mark iOS Safari job start
        run: echo "IOS_JOB_STARTED_AT_MS=$(node -p 'Date.now()')" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - name: Restore shared quality dependencies
        id: quality-dependencies
        uses: ./.github/actions/setup-quality-dependencies
        with:
          # Node 24 undici can intermittently raise setTypeOfService EINVAL on macOS runners.
          node-version: 22
      - name: Restore iOS Safari stability history
        uses: actions/cache/restore@v5
        with:
          path: .superpowers/visual-regression/ios-safari-stability/ios-safari-stability-trend-history.json
          key: ios-safari-stability-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-safari-stability-v2-${{ runner.os }}-
      - name: Seed hardened iOS history from successful run artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SEED_DIR="$RUNNER_TEMP/ios-safari-stability-seed"
          HISTORY_PATH=".superpowers/visual-regression/ios-safari-stability/ios-safari-stability-trend-history.json"
          mkdir -p "$SEED_DIR"
          CURRENT_SAMPLES="$(jq -r '[.samples[] | select(.policyRevision == 3)] | length' "$HISTORY_PATH" 2>/dev/null || printf '0')"
          LEGACY_DOWNLOADED=0
          while read -r PREVIOUS_RUN_ID; do
            test -n "$PREVIOUS_RUN_ID" || continue
            if gh run download "$PREVIOUS_RUN_ID" \
              --pattern "ios-safari-stability-history-$PREVIOUS_RUN_ID" \
              --dir "$SEED_DIR/$PREVIOUS_RUN_ID"; then
              continue
            fi
            if test "$CURRENT_SAMPLES" -lt 3 && test "$LEGACY_DOWNLOADED" -lt 4; then
              gh run download "$PREVIOUS_RUN_ID" \
                --pattern "ios-safari-visual-$PREVIOUS_RUN_ID" \
                --dir "$SEED_DIR/$PREVIOUS_RUN_ID" || true
              LEGACY_DOWNLOADED=$((LEGACY_DOWNLOADED + 1))
            fi
          done < <(gh run list --workflow ios-safari-visual.yml --status success --limit 15 \
            --json databaseId --jq '.[].databaseId')
          node scripts/seed-ios-safari-stability-history.mjs --input-dir "$SEED_DIR" --history "$HISTORY_PATH"
      - name: Restore Appium and prebuilt WebDriverAgent
        id: ios-automation-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.appium
            ~/.npm
            .cache/ios-safari-appium
            .cache/ios-safari-wda
          key: ios-safari-automation-${{ runner.os }}-xcode-16.4-appium-3.6.0-xcuitest-11.4.0-v4
          restore-keys: |
            ios-safari-automation-${{ runner.os }}-xcode-16.4-appium-3.6.0-xcuitest-11.4.0-
            ios-safari-automation-${{ runner.os }}-xcode-16.4-appium-3-
      - name: Select pinned Xcode and warm Simulator services
        shell: bash
        run: |
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_16.4*.app' | sort | head -n 1)"
          test -n "$XCODE_APP"
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun simctl list > /dev/null
          IOS_SIMULATOR_UDID="$(xcrun simctl list devices available --json | jq -r '.devices | to_entries[] | select(.key | contains("iOS-18-5")) | .value[] | select(.name == "iPhone 16 Pro") | .udid' | head -n 1)"
          test -n "$IOS_SIMULATOR_UDID"
          echo "IOS_SIMULATOR_UDID=$IOS_SIMULATOR_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$IOS_SIMULATOR_UDID"
          xcrun simctl bootstatus "$IOS_SIMULATOR_UDID" -b
      - name: Install the iOS Safari automation bridge
        id: ios-automation-bridge
        shell: bash
        run: |
          BRIDGE_STARTED_AT_MS="$(node -p 'Date.now()')"
          export BRIDGE_STARTED_AT_MS
          APPIUM_CACHE_DIR="$GITHUB_WORKSPACE/.cache/ios-safari-appium"
          APPIUM_BIN="$APPIUM_CACHE_DIR/node_modules/.bin/appium"
          APPIUM_CACHE_HIT=false
          if test -x "$APPIUM_BIN" \
            && test "$(node -p "require('$APPIUM_CACHE_DIR/node_modules/appium/package.json').version" 2>/dev/null || true)" = "3.6.0"; then
            APPIUM_CACHE_HIT=true
          else
            npm install --prefix "$APPIUM_CACHE_DIR" --no-audit --no-fund --no-save appium@3.6.0
          fi
          echo "$APPIUM_CACHE_DIR/node_modules/.bin" >> "$GITHUB_PATH"
          if ! test -d "$HOME/.appium/node_modules/appium-xcuitest-driver"; then
            "$APPIUM_BIN" driver install xcuitest@11.4.0
          fi
          WDA_CACHE_DIR="$GITHUB_WORKSPACE/.cache/ios-safari-wda"
          mkdir -p "$(dirname "$WDA_CACHE_DIR")"
          IOS_PREBUILT_WDA_PATH=""
          if test -d "$WDA_CACHE_DIR"; then
            IOS_PREBUILT_WDA_PATH="$(find "$WDA_CACHE_DIR" -type d -name 'WebDriverAgentRunner-Runner.app' | head -n 1)"
          fi
          if test -z "$IOS_PREBUILT_WDA_PATH"; then
            "$APPIUM_BIN" driver run xcuitest download-wda -- --outdir="$WDA_CACHE_DIR" --kind=sim --platform=ios
            IOS_PREBUILT_WDA_PATH="$(find "$WDA_CACHE_DIR" -type d -name 'WebDriverAgentRunner-Runner.app' | head -n 1)"
          fi
          test -n "$IOS_PREBUILT_WDA_PATH"
          echo "IOS_PREBUILT_WDA_PATH=$IOS_PREBUILT_WDA_PATH" >> "$GITHUB_ENV"
          echo "cache-hit=$APPIUM_CACHE_HIT" >> "$GITHUB_OUTPUT"
          echo "duration-ms=$(node -p 'Math.max(0, Date.now() - Number(process.env.BRIDGE_STARTED_AT_MS))')" >> "$GITHUB_OUTPUT"
          "$APPIUM_BIN" --version
      - name: Restore commit-matched device build
        id: quality-build
        uses: ./.github/actions/restore-quality-build
        with:
          variant: device
          target-sha: ${{ github.sha }}
          github-token: ${{ github.token }}
      - name: Mark local iOS fallback build start
        id: local-quality-build-start
        if: steps.quality-build.outputs.restored != 'true'
        run: echo "started-at-ms=$(node -p 'Date.now()')" >> "$GITHUB_OUTPUT"
      - name: Build device client locally when shared artifact is unavailable
        if: steps.quality-build.outputs.restored != 'true'
        run: |
          pnpm characters:generate
          pnpm --filter @wedding-game/shared build
          VITE_WORKER_URL=https://example.invalid VITE_INVITATION_ID=device-pwa-audit pnpm --filter @wedding-game/client build
      - name: Report iOS quality CI efficiency
        if: always()
        uses: ./.github/actions/report-quality-ci-efficiency
        with:
          workflow: ios
          variant: device
          dependency-cache-hit: ${{ steps.quality-dependencies.outputs.cache-hit || 'false' }}
          dependency-setup-duration-ms: ${{ steps.quality-dependencies.outputs.setup-duration-ms || '0' }}
          build-restored: ${{ steps.quality-build.outputs.restored || 'false' }}
          restore-duration-ms: ${{ steps.quality-build.outputs.restore-duration-ms || '0' }}
          artifact-bytes: ${{ steps.quality-build.outputs.artifact-bytes || '0' }}
          producer-build-duration-ms: ${{ steps.quality-build.outputs.producer-build-duration-ms || '0' }}
          fallback-started-at-ms: ${{ steps.local-quality-build-start.outputs.started-at-ms || '0' }}
      - name: Start deterministic invitation server
        shell: bash
        run: |
          pnpm --filter @wedding-game/client exec vite --host 0.0.0.0 --port 4178 --strictPort > "$RUNNER_TEMP/ios-safari-vite.log" 2>&1 &
          echo "VITE_PID=$!" >> "$GITHUB_ENV"
          pnpm --filter @wedding-game/client exec vite preview --host 0.0.0.0 --port 4188 --strictPort > "$RUNNER_TEMP/ios-safari-pwa-preview.log" 2>&1 &
          echo "PWA_PREVIEW_PID=$!" >> "$GITHUB_ENV"
          appium --base-path /wd/hub --port 4723 --log "$RUNNER_TEMP/ios-safari-appium.log" > /dev/null 2>&1 &
          echo "APPIUM_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4178/ > /dev/null \
              && curl --fail --silent http://127.0.0.1:4188/ > /dev/null \
              && curl --fail --silent http://127.0.0.1:4723/wd/hub/status > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ios-safari-vite.log"
          cat "$RUNNER_TEMP/ios-safari-pwa-preview.log"
          exit 1
      - name: Mark iOS Safari capture start
        run: echo "IOS_CAPTURE_STARTED_AT_MS=$(node -p 'Date.now()')" >> "$GITHUB_ENV"
      - name: Capture and compare real Mobile Safari
        id: capture
        continue-on-error: true
        shell: bash
        run: |
          IOS_URL_WARMED=false
          for attempt in 1 2 3; do
            if xcrun simctl openurl "$IOS_SIMULATOR_UDID" http://127.0.0.1:4178/; then
              IOS_URL_WARMED=true
              break
            fi
            if test "$attempt" -lt 3; then
              xcrun simctl bootstatus "$IOS_SIMULATOR_UDID" -b
              sleep 3
            fi
          done
          if test "$IOS_URL_WARMED" != true; then
            echo "::warning::Simulator URL warm-up timed out; rebooting once before Appium navigation"
            xcrun simctl shutdown "$IOS_SIMULATOR_UDID" || true
            xcrun simctl boot "$IOS_SIMULATOR_UDID"
            xcrun simctl bootstatus "$IOS_SIMULATOR_UDID" -b
            if ! xcrun simctl openurl "$IOS_SIMULATOR_UDID" http://127.0.0.1:4178/; then
              echo "::warning::Simulator URL warm-up still unavailable; Appium will perform the authoritative navigation"
            fi
          fi
          sleep 3
          pnpm visual:ios-safari -- \
            --mode auto \
            --url http://127.0.0.1:4178/ \
            --pwa-url http://127.0.0.1:4188/ \
            --preview-host-url http://127.0.0.1:4188/ \
            --compositor-fault-injection "$IOS_COMPOSITOR_FAULT_INJECTION"
        env:
          IOS_COMPOSITOR_FAULT_INJECTION: ${{ github.event_name == 'schedule' && github.event.schedule == '47 4 1 * *' && 'recreate-session' || github.event_name == 'schedule' && 'activate-refresh' || inputs.compositor_fault_injection || 'none' }}
      - name: Track ten-run iOS Safari stability
        if: always()
        shell: bash
        run: |
          DURATION_MS="$(node -p 'Math.max(0, Date.now() - Number(process.env.IOS_CAPTURE_STARTED_AT_MS || Date.now()))')"
          SETUP_DURATION_MS="$(node -p 'Math.max(0, Number(process.env.IOS_CAPTURE_STARTED_AT_MS || Date.now()) - Number(process.env.IOS_JOB_STARTED_AT_MS || Date.now()))')"
          CAPTURE_REPORT=.superpowers/visual-regression/ios-safari/ios-safari-capture-report.json
          COMPOSITOR_RECOVERY_COUNT="$(jq -r '.nativeCompositor.recoveryCount // 0' "$CAPTURE_REPORT" 2>/dev/null || printf '0')"
          COMPOSITOR_RECOVERY_DURATION_MS="$(jq -r '.nativeCompositor.recoveryDurationMs // 0' "$CAPTURE_REPORT" 2>/dev/null || printf '0')"
          COMPOSITOR_FAULT_INJECTED="$(jq -r '.nativeCompositor.faultInjection.triggered // false' "$CAPTURE_REPORT" 2>/dev/null || printf 'false')"
          COMPOSITOR_FAULT_RECOVERED="$(jq -r '.nativeCompositor.faultInjection.recovered // false' "$CAPTURE_REPORT" 2>/dev/null || printf 'false')"
          COMPOSITOR_RECOVERY_STRATEGY="$(jq -r '.nativeCompositor.faultInjection.recoveryStrategy // ""' "$CAPTURE_REPORT" 2>/dev/null || printf '')"
          CAPTURE_PHASE_TIMINGS_JSON="$(jq -c '.phaseTimings // {} | with_entries(.value = (.value.durationMs // 0))' "$CAPTURE_REPORT" 2>/dev/null || printf '{}')"
          pnpm visual:ios-safari:stability -- \
            --outcome "${{ steps.capture.outcome }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --sha "$GITHUB_SHA" \
            --duration-ms "$DURATION_MS" \
            --setup-duration-ms "$SETUP_DURATION_MS" \
            --capture-duration-ms "$DURATION_MS" \
            --capture-phase-timings-json "$CAPTURE_PHASE_TIMINGS_JSON" \
            --bridge-install-duration-ms "${{ steps.ios-automation-bridge.outputs.duration-ms || '0' }}" \
            --appium-cache-hit "${{ steps.ios-automation-bridge.outputs.cache-hit || 'false' }}" \
            --compositor-recovery-count "$COMPOSITOR_RECOVERY_COUNT" \
            --compositor-recovery-duration-ms "$COMPOSITOR_RECOVERY_DURATION_MS" \
            --compositor-fault-injected "$COMPOSITOR_FAULT_INJECTED" \
            --compositor-fault-recovered "$COMPOSITOR_FAULT_RECOVERED" \
            --compositor-recovery-strategy "$COMPOSITOR_RECOVERY_STRATEGY" \
            --wda-mode preinstalled \
            --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Stop invitation server
        if: always()
        shell: bash
        run: |
          if test -n "${VITE_PID:-}"; then kill "$VITE_PID" 2>/dev/null || true; fi
          if test -n "${PWA_PREVIEW_PID:-}"; then kill "$PWA_PREVIEW_PID" 2>/dev/null || true; fi
          if test -n "${APPIUM_PID:-}"; then kill "$APPIUM_PID" 2>/dev/null || true; fi
      - name: Package content-addressed iOS quality evidence
        if: always()
        run: |
          node scripts/pack-content-addressed-quality-evidence.mjs --input-dir .superpowers/visual-regression/ios-safari --output-dir .quality-artifacts/ios-safari --exclude-suffix=-diff.png
          node scripts/pack-content-addressed-quality-evidence.mjs --input-dir .superpowers/visual-regression/ios-safari-stability --output-dir .quality-artifacts/ios-safari-stability
      - name: Upload real iOS Safari evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-safari-visual-${{ github.run_id }}
          path: |
            .quality-artifacts/ios-safari
            .quality-artifacts/ios-safari-stability
            ${{ runner.temp }}/ios-safari-vite.log
            ${{ runner.temp }}/ios-safari-pwa-preview.log
            ${{ runner.temp }}/ios-safari-appium.log
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 9
          retention-days: 7
      - name: Upload failed iOS Safari visual differences
        if: steps.capture.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ios-safari-diff-${{ github.run_id }}
          path: .superpowers/visual-regression/ios-safari/**/*-diff.png
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 14
      - name: Upload lightweight iOS Safari stability history
        if: ${{ always() && hashFiles('.superpowers/visual-regression/ios-safari-stability/ios-safari-stability-trend-history.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-safari-stability-history-${{ github.run_id }}
          path: |
            .superpowers/visual-regression/ios-safari-stability/ios-safari-stability-trend-history.json
            .superpowers/visual-regression/ios-safari-stability/ios-safari-stability-trend.json
          if-no-files-found: error
          retention-days: 30
      - name: Save iOS Safari stability history
        if: ${{ always() && hashFiles('.superpowers/visual-regression/ios-safari-stability/ios-safari-stability-trend-history.json') != '' }}
        uses: actions/cache/save@v5
        with:
          path: .superpowers/visual-regression/ios-safari-stability/ios-safari-stability-trend-history.json
          key: ios-safari-stability-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save Appium and prebuilt WebDriverAgent
        if: ${{ success() && steps.ios-automation-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.appium
            ~/.npm
            .cache/ios-safari-appium
            .cache/ios-safari-wda
          key: ios-safari-automation-${{ runner.os }}-xcode-16.4-appium-3.6.0-xcuitest-11.4.0-v4
      - name: Fail when the Safari capture failed
        if: steps.capture.outcome != 'success'
        run: exit 1
