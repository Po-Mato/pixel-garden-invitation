name: Shared quality build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: shared-quality-build-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Restore shared quality dependencies
        uses: ./.github/actions/setup-quality-dependencies
        with:
          node-version: 24
      - name: Build production quality workspace once
        run: pnpm build
        env:
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL || 'https://example.invalid' }}
          VITE_INVITATION_ID: ${{ vars.VITE_INVITATION_ID || 'sample-garden' }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: Preserve production client
        run: |
          mkdir -p .quality-build/production
          cp -R client/dist/. .quality-build/production/
      - name: Build isolated device quality client
        run: pnpm --filter @wedding-game/client build
        env:
          VITE_WORKER_URL: https://example.invalid
          VITE_INVITATION_ID: device-pwa-audit
      - name: Preserve device client and manifest
        run: |
          mkdir -p .quality-build/device
          cp -R client/dist/. .quality-build/device/
          node -e 'require("node:fs").writeFileSync(".quality-build/quality-build-manifest.json", JSON.stringify({version:1, sha:process.env.GITHUB_SHA, variants:["production","device"]}, null, 2) + "\n")'
      - name: Upload shared build once per commit
        uses: actions/upload-artifact@v7
        with:
          name: quality-build-${{ github.sha }}
          path: .quality-build
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 9
          retention-days: 7
