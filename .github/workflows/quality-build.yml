name: Shared quality build

on:
  workflow_dispatch:
    inputs:
      force_cold_sample:
        description: Bypass workspace dependencies and publish an intentional cold-cache timing sample
        required: false
        default: false
        type: boolean
      release_sha:
        description: Full release commit SHA that owns a forced cold-cache sample
        required: false
        default: ""
        type: string
  schedule:
    - cron: "23 5 1 * *"
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: shared-quality-build-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Bind forced cold sample to its release commit
        if: ${{ inputs.force_cold_sample == true }}
        env:
          REQUESTED_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          test -n "$REQUESTED_RELEASE_SHA" || { echo "release_sha is required for a forced cold sample" >&2; exit 1; }
          RESOLVED_RELEASE_SHA="$(git rev-parse "$REQUESTED_RELEASE_SHA^{commit}")"
          test "$RESOLVED_RELEASE_SHA" = "$GITHUB_SHA" || {
            echo "release_sha $RESOLVED_RELEASE_SHA does not match checked out commit $GITHUB_SHA" >&2
            exit 1
          }
      - name: Mark intentional cold-cache sample start
        id: intentional-cold-start
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '23 5 1 * *') || inputs.force_cold_sample == true }}
        run: echo "started-at-ms=$(node -p 'Date.now()')" >> "$GITHUB_OUTPUT"
      - name: Restore shared quality dependencies
        id: quality-dependencies
        uses: ./.github/actions/setup-quality-dependencies
        with:
          node-version: 24
          force-cold: ${{ (github.event_name == 'schedule' && github.event.schedule == '23 5 1 * *') || inputs.force_cold_sample == true }}
      - name: Verify visual baseline provenance
        run: pnpm visual:provenance:verify
      - name: Build production quality workspace once
        run: |
          echo "QUALITY_PRODUCTION_BUILD_STARTED_AT_MS=$(node -p 'Date.now()')" >> "$GITHUB_ENV"
          pnpm build
        env:
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL || 'https://example.invalid' }}
          VITE_INVITATION_ID: ${{ vars.VITE_INVITATION_ID || 'sample-garden' }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: Preserve production client and generated runtime assets
        run: |
          echo "QUALITY_PRODUCTION_BUILD_DURATION_MS=$(node -p 'Math.max(0, Date.now() - Number(process.env.QUALITY_PRODUCTION_BUILD_STARTED_AT_MS))')" >> "$GITHUB_ENV"
          mkdir -p .quality-build/production
          cp -R client/dist/. .quality-build/production/
          mkdir -p .quality-build/generated-characters
          cp -R client/public/characters/generated/. .quality-build/generated-characters/
      - name: Build isolated device quality client
        run: |
          echo "QUALITY_DEVICE_BUILD_STARTED_AT_MS=$(node -p 'Date.now()')" >> "$GITHUB_ENV"
          pnpm --filter @wedding-game/client build
        env:
          VITE_WORKER_URL: https://example.invalid
          VITE_INVITATION_ID: device-pwa-audit
      - name: Preserve device client and manifest
        run: |
          QUALITY_DEVICE_BUILD_DURATION_MS="$(node -p 'Math.max(0, Date.now() - Number(process.env.QUALITY_DEVICE_BUILD_STARTED_AT_MS))')"
          export QUALITY_DEVICE_BUILD_DURATION_MS
          echo "QUALITY_DEVICE_BUILD_DURATION_MS=$QUALITY_DEVICE_BUILD_DURATION_MS" >> "$GITHUB_ENV"
          mkdir -p .quality-build/device
          cp -R client/dist/. .quality-build/device/
          node -e 'require("node:fs").writeFileSync(".quality-build/quality-build-manifest.json", JSON.stringify({version:1, sha:process.env.GITHUB_SHA, variants:["production","device"], buildDurationsMs:{production:Number(process.env.QUALITY_PRODUCTION_BUILD_DURATION_MS)||0, device:Number(process.env.QUALITY_DEVICE_BUILD_DURATION_MS)||0}}, null, 2) + "\n")'
      - name: Verify shared build runtime contract
        run: pnpm quality:build-contract -- --mode package --package-dir .quality-build --expected-sha "$GITHUB_SHA"
      - name: Upload shared build once per commit
        uses: actions/upload-artifact@v7
        with:
          name: quality-build-${{ github.sha }}
          path: .quality-build
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 9
          retention-days: 7
      - name: Record intentional monthly cold-cache timing sample
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '23 5 1 * *') || inputs.force_cold_sample == true }}
        env:
          COLD_SAMPLE_STARTED_AT_MS: ${{ steps.intentional-cold-start.outputs.started-at-ms }}
          COLD_SAMPLE_RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          node scripts/record-quality-ci-efficiency.mjs \
            --workflow cold-sample \
            --variant production \
            --sample-kind intentional-cold \
            --release-sha "$COLD_SAMPLE_RELEASE_SHA" \
            --dependency-cache-hit "${{ steps.quality-dependencies.outputs.cache-hit || 'false' }}" \
            --dependency-setup-duration-ms "${{ steps.quality-dependencies.outputs.setup-duration-ms || '0' }}" \
            --build-restored false \
            --producer-build-duration-ms "$((QUALITY_PRODUCTION_BUILD_DURATION_MS + QUALITY_DEVICE_BUILD_DURATION_MS))" \
            --run-duration-ms "$(node -p 'Math.max(0, Date.now() - Number(process.env.COLD_SAMPLE_STARTED_AT_MS))')" \
            --output-dir .quality-ci-intentional-cold
      - name: Upload intentional monthly cold-cache sample
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '23 5 1 * *') || inputs.force_cold_sample == true }}
        uses: actions/upload-artifact@v7
        with:
          name: quality-ci-intentional-cold-${{ github.run_id }}
          path: .quality-ci-intentional-cold/quality-ci-efficiency-cold-sample.json
          if-no-files-found: error
          retention-days: 120
