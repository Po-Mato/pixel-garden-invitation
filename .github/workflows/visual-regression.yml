name: Mobile visual regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "client/public/assets/maps/**"
      - "client/public/characters/**"
      - "client/src/components/GameWorld.tsx"
      - "client/src/components/PortalDestinationPreview.tsx"
      - "client/src/components/Npc*.tsx"
      - "client/src/components/GamePerformanceStatus.tsx"
      - "client/src/components/World*.tsx"
      - "client/src/game/world*.ts"
      - "client/src/game/npcMotion.ts"
      - "client/src/game/npcDialogue.ts"
      - "client/src/performance/**"
      - "client/src/map-visual-enhancements.css"
      - "client/src/game-navigation-enhancements.css"
      - "client/src/game-discovery-dashboard.css"
      - "client/src/npc-reactions.css"
      - "character-assets/**"
      - "map-assets/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "client/public/assets/maps/**"
      - "client/public/characters/**"
      - "client/src/components/GameWorld.tsx"
      - "client/src/components/PortalDestinationPreview.tsx"
      - "client/src/components/Npc*.tsx"
      - "client/src/components/GamePerformanceStatus.tsx"
      - "client/src/components/World*.tsx"
      - "client/src/game/world*.ts"
      - "client/src/game/npcMotion.ts"
      - "client/src/game/npcDialogue.ts"
      - "client/src/performance/**"
      - "client/src/map-visual-enhancements.css"
      - "client/src/game-navigation-enhancements.css"
      - "client/src/game-discovery-dashboard.css"
      - "client/src/npc-reactions.css"
      - "character-assets/**"
      - "map-assets/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm visual:test
      - name: Install mobile browser engines
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Audit live mobile HUD screenshots
        run: pnpm visual:hud-browser
      - name: Audit Android and iOS long-session stability
        run: pnpm visual:mobile-soak
      - name: Upload visual region report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-visual-region-report-${{ github.run_id }}
          path: .superpowers/visual-regression/mobile-game-regions.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload visual difference
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-visual-regression-${{ github.run_id }}
          path: .superpowers/visual-regression
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload world layout report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-layout-region-report-${{ github.run_id }}
          path: .superpowers/visual-regression/world-layout-regions.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload world layout difference
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: world-layout-regression-${{ github.run_id }}
          path: |
            .superpowers/visual-regression/world-layout-current.png
            .superpowers/visual-regression/world-layout-diff.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload mobile HUD browser audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-hud-browser-${{ github.run_id }}
          path: .superpowers/visual-regression/mobile-hud-browser
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload mobile device soak audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-device-soak-${{ github.run_id }}
          path: .superpowers/visual-regression/mobile-device-soak
          if-no-files-found: ignore
          retention-days: 14
