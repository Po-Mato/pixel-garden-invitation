name: Mobile visual regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "client/public/assets/maps/**"
      - "client/public/characters/**"
      - "client/public/map-diagnostic-bundle-viewer.html"
      - "client/src/components/GameWorld.tsx"
      - "client/src/components/PortalDestinationPreview.tsx"
      - "client/src/components/Npc*.tsx"
      - "client/src/components/GamePerformanceStatus.tsx"
      - "client/src/components/World*.tsx"
      - "client/src/game/world*.ts"
      - "client/src/game/world*.json"
      - "client/src/game/npcMotion.ts"
      - "client/src/game/npcDialogue.ts"
      - "client/src/performance/**"
      - "client/src/map-visual-enhancements.css"
      - "client/src/game-navigation-enhancements.css"
      - "client/src/game-discovery-dashboard.css"
      - "client/src/npc-reactions.css"
      - "character-assets/**"
      - "map-assets/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "client/public/assets/maps/**"
      - "client/public/characters/**"
      - "client/public/map-diagnostic-bundle-viewer.html"
      - "client/src/components/GameWorld.tsx"
      - "client/src/components/PortalDestinationPreview.tsx"
      - "client/src/components/Npc*.tsx"
      - "client/src/components/GamePerformanceStatus.tsx"
      - "client/src/components/World*.tsx"
      - "client/src/game/world*.ts"
      - "client/src/game/world*.json"
      - "client/src/game/npcMotion.ts"
      - "client/src/game/npcDialogue.ts"
      - "client/src/performance/**"
      - "client/src/map-visual-enhancements.css"
      - "client/src/game-navigation-enhancements.css"
      - "client/src/game-discovery-dashboard.css"
      - "client/src/npc-reactions.css"
      - "character-assets/**"
      - "map-assets/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read
  pull-requests: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore map foreground depth history
        id: foreground-depth-history
        uses: actions/cache/restore@v5
        with:
          path: .superpowers/visual-regression/map-foreground-depth-history.json
          key: map-foreground-depth-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            map-foreground-depth-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-
      - name: Restore world geometry policy history
        id: geometry-policy-history
        uses: actions/cache/restore@v5
        with:
          path: .superpowers/visual-regression/world-geometry-policy-history.json
          key: world-geometry-policy-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            world-geometry-policy-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-
      - run: pnpm visual:test
      - name: Render map foreground diagnostics
        run: pnpm maps:foreground-audit
      - name: Suggest foreground depth and collision geometry
        run: pnpm maps:foreground-suggest -- --preview-patch
      - name: Track foreground depth gap history
        run: pnpm maps:foreground-trend -- --sha "${{ github.sha }}" --ref-label "${{ github.ref_type }}:${{ github.ref_name }}"
      - name: Recommend world geometry policy tuning
        run: pnpm maps:geometry-policy-trend -- --sha "${{ github.sha }}" --ref-label "${{ github.ref_type }}:${{ github.ref_name }}"
      - name: Summarize foreground diagnostics for pull requests
        if: always()
        run: pnpm maps:foreground-summary -- --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Save map foreground depth history
        if: success() && steps.foreground-depth-history.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .superpowers/visual-regression/map-foreground-depth-history.json
          key: map-foreground-depth-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-${{ github.sha }}
      - name: Save world geometry policy history
        if: success() && steps.geometry-policy-history.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .superpowers/visual-regression/world-geometry-policy-history.json
          key: world-geometry-policy-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-${{ github.sha }}
      - name: Install mobile browser engines
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Audit live mobile HUD screenshots
        run: pnpm visual:hud-browser
      - name: Audit map diagnostic screenshots
        run: pnpm visual:map-diagnostics
      - name: Audit Android and iOS long-session stability
        run: pnpm visual:mobile-soak
      - name: Upload visual region report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-visual-region-report-${{ github.run_id }}
          path: .superpowers/visual-regression/mobile-game-regions.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload visual difference
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-visual-regression-${{ github.run_id }}
          path: .superpowers/visual-regression
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload world layout report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-layout-region-report-${{ github.run_id }}
          path: |
            .superpowers/visual-regression/world-layout-regions.json
            .superpowers/visual-regression/world-geometry-policy-report.json
            .superpowers/visual-regression/world-geometry-policy-history.json
            .superpowers/visual-regression/world-geometry-policy-tuning.json
            .superpowers/visual-regression/world-geometry-policy-tuning.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload world layout difference
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: world-layout-regression-${{ github.run_id }}
          path: |
            .superpowers/visual-regression/world-layout-current.png
            .superpowers/visual-regression/world-layout-diff.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload mobile HUD browser audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-hud-browser-${{ github.run_id }}
          path: .superpowers/visual-regression/mobile-hud-browser
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload mobile device soak audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-device-soak-${{ github.run_id }}
          path: .superpowers/visual-regression/mobile-device-soak
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload map diagnostics browser audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: map-diagnostics-browser-${{ github.run_id }}
          path: .superpowers/visual-regression/map-diagnostics-browser
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload map foreground diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: map-foreground-diagnostics-${{ github.run_id }}
          path: |
            .superpowers/visual-regression/map-foreground-audit.png
            .superpowers/visual-regression/map-foreground-audit.json
            .superpowers/visual-regression/map-foreground-suggestions.json
            .superpowers/visual-regression/map-foreground-suggestions.patch.json
            .superpowers/visual-regression/map-foreground-rollback.patch.json
            .superpowers/visual-regression/map-foreground-depth-history.json
            .superpowers/visual-regression/map-foreground-depth-trend.json
            .superpowers/visual-regression/map-foreground-depth-trend.md
            .superpowers/visual-regression/map-foreground-depth-trend.html
            .superpowers/visual-regression/map-foreground-pr-summary.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Comment map foreground diagnostics on the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const summaryPath = ".superpowers/visual-regression/map-foreground-pr-summary.md";
            if (!fs.existsSync(summaryPath)) return;
            const body = fs.readFileSync(summaryPath, "utf8");
            const marker = "<!-- map-foreground-diagnostics -->";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find((comment) => comment.user?.type === "Bot" && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
