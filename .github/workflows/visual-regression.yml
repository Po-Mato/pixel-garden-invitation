name: Mobile visual regression

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "client/public/assets/maps/**"
      - "client/public/characters/**"
      - "client/public/map-diagnostic-bundle-viewer.html"
      - "client/public/map-diagnostic-delta.schema.json"
      - ".github/world-geometry-policy-owners.json"
      - ".github/workflows/apply-approved-map-patch.yml"
      - ".github/workflows/map-patch-automation-e2e.yml"
      - ".github/workflows/visual-regression.yml"
      - "client/src/components/GameWorld.tsx"
      - "client/src/components/PortalDestinationPreview.tsx"
      - "client/src/components/Npc*.tsx"
      - "client/src/components/GamePerformanceStatus.tsx"
      - "client/src/components/World*.tsx"
      - "client/src/game/world*.ts"
      - "client/src/game/world*.json"
      - "client/src/game/npcMotion.ts"
      - "client/src/game/npcDialogue.ts"
      - "client/src/performance/**"
      - "client/src/device-performance.css"
      - "client/src/**/*.css"
      - "client/src/pwa/**"
      - "client/vite.config.ts"
      - "client/src/map-visual-enhancements.css"
      - "client/src/game-navigation-enhancements.css"
      - "client/src/game-discovery-dashboard.css"
      - "client/src/npc-reactions.css"
      - "character-assets/**"
      - "map-assets/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "client/public/assets/maps/**"
      - "client/public/characters/**"
      - "client/public/map-diagnostic-bundle-viewer.html"
      - "client/public/map-diagnostic-delta.schema.json"
      - ".github/world-geometry-policy-owners.json"
      - ".github/workflows/apply-approved-map-patch.yml"
      - ".github/workflows/map-patch-automation-e2e.yml"
      - ".github/workflows/visual-regression.yml"
      - "client/src/components/GameWorld.tsx"
      - "client/src/components/PortalDestinationPreview.tsx"
      - "client/src/components/Npc*.tsx"
      - "client/src/components/GamePerformanceStatus.tsx"
      - "client/src/components/World*.tsx"
      - "client/src/game/world*.ts"
      - "client/src/game/world*.json"
      - "client/src/game/npcMotion.ts"
      - "client/src/game/npcDialogue.ts"
      - "client/src/performance/**"
      - "client/src/device-performance.css"
      - "client/src/**/*.css"
      - "client/src/pwa/**"
      - "client/vite.config.ts"
      - "client/src/map-visual-enhancements.css"
      - "client/src/game-navigation-enhancements.css"
      - "client/src/game-discovery-dashboard.css"
      - "client/src/npc-reactions.css"
      - "character-assets/**"
      - "map-assets/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore shared quality dependencies
        uses: ./.github/actions/setup-quality-dependencies
        with:
          node-version: 24
      - name: Restore map foreground depth history
        id: foreground-depth-history
        uses: actions/cache/restore@v5
        with:
          path: .superpowers/visual-regression/map-foreground-depth-history.json
          key: map-foreground-depth-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            map-foreground-depth-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-
      - name: Restore world geometry policy history
        id: geometry-policy-history
        uses: actions/cache/restore@v5
        with:
          path: .superpowers/visual-regression/world-geometry-policy-history.json
          key: world-geometry-policy-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            world-geometry-policy-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-
      - name: Restore world geometry policy review state
        id: geometry-policy-review-state
        uses: actions/cache/restore@v5
        with:
          path: .superpowers/visual-regression/world-geometry-policy-review-state.json
          key: world-geometry-policy-review-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            world-geometry-policy-review-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-
      - name: Restore low-power soak trend history
        id: mobile-soak-trend-history
        uses: actions/cache/restore@v5
        with:
          path: .superpowers/visual-regression/mobile-device-soak/mobile-device-soak-trend-history.json
          key: mobile-soak-trend-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            mobile-soak-trend-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-
      - run: pnpm visual:test
      - name: Restore commit-matched production build
        id: quality-build
        uses: ./.github/actions/restore-quality-build
        with:
          variant: production
          target-sha: ${{ github.sha }}
          github-token: ${{ github.token }}
      - name: Build client locally when shared artifact is unavailable
        if: steps.quality-build.outputs.restored != 'true'
        run: pnpm --filter @wedding-game/client build
        env:
          VITE_WORKER_URL: https://example.invalid
          VITE_INVITATION_ID: sample-garden
      - name: Render map foreground diagnostics
        run: pnpm maps:foreground-audit
      - name: Suggest foreground depth and collision geometry
        run: pnpm maps:foreground-suggest -- --preview-patch
      - name: Track foreground depth gap history
        run: pnpm maps:foreground-trend -- --sha "${{ github.sha }}" --ref-label "${{ github.ref_type }}:${{ github.ref_name }}"
      - name: Recommend world geometry policy tuning
        run: pnpm maps:geometry-policy-trend -- --sha "${{ github.sha }}" --ref-label "${{ github.ref_type }}:${{ github.ref_name }}"
      - name: Assign policy owners and review deadlines
        run: pnpm maps:geometry-policy-governance
      - name: Summarize world geometry policy review
        run: pnpm maps:geometry-policy-summary -- --approved "${{ contains(github.event.pull_request.labels.*.name, 'geometry-policy-approved') }}" --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Prepare expired policy issue request
        run: pnpm maps:geometry-policy-issue -- --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Open, update, or close the expired policy issue
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const request = JSON.parse(fs.readFileSync(".superpowers/visual-regression/world-geometry-policy-issue.json", "utf8"));
            const marker = "<!-- world-geometry-policy-expiry -->";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "all", per_page: 100 });
            const managed = issues
              .filter((issue) => !issue.pull_request && issue.body?.includes(marker))
              .sort((left, right) => right.number - left.number)[0];
            if (request.action === "close") {
              if (managed?.state === "open") {
                await github.rest.issues.update({ owner, repo, issue_number: managed.number, state: "closed", title: request.issue.title, body: request.issue.body });
              }
              return;
            }
            try {
              await github.rest.issues.getLabel({ owner, repo, name: request.issue.label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({ owner, repo, name: request.issue.label, color: "c84b31", description: "CI-managed expired world geometry recommendations" });
            }
            if (managed) {
              await github.rest.issues.update({ owner, repo, issue_number: managed.number, state: "open", title: request.issue.title, body: request.issue.body, labels: [request.issue.label] });
            } else {
              await github.rest.issues.create({ owner, repo, title: request.issue.title, body: request.issue.body, labels: [request.issue.label] });
            }
      - name: Summarize foreground diagnostics for pull requests
        if: always()
        run: pnpm maps:foreground-summary -- --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Save map foreground depth history
        if: success() && steps.foreground-depth-history.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .superpowers/visual-regression/map-foreground-depth-history.json
          key: map-foreground-depth-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-${{ github.sha }}
      - name: Save world geometry policy history
        if: success() && steps.geometry-policy-history.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .superpowers/visual-regression/world-geometry-policy-history.json
          key: world-geometry-policy-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-${{ github.sha }}
      - name: Save world geometry policy review state
        if: success() && steps.geometry-policy-review-state.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .superpowers/visual-regression/world-geometry-policy-review-state.json
          key: world-geometry-policy-review-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-${{ github.sha }}
      - name: Restore Playwright browser cache
        id: playwright-browser-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-1.62.0
      - name: Install mobile browser system dependencies
        run: pnpm exec playwright install-deps chromium webkit
      - name: Install mobile browser engines on cache miss
        if: steps.playwright-browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium webkit
      - name: Restore main PWA cache asset history
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v5
        with:
          path: .superpowers/visual-regression/game-resource-budget/pwa-cache-asset-trend-history.json
          key: pwa-cache-assets-${{ runner.os }}-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          restore-keys: |
            pwa-cache-assets-${{ runner.os }}-main-
      - name: Verify game CSS and font request budgets
        run: pnpm performance:resource-budget
      - name: Audit live mobile HUD screenshots
        run: pnpm visual:hud-browser
      - name: Audit real two-client movement and UI collisions
        run: pnpm visual:two-client
      - name: Audit map diagnostic screenshots
        run: pnpm visual:map-diagnostics
      - name: Audit Android and iOS long-session stability
        run: pnpm visual:mobile-soak
      - name: Save low-power soak trend history
        if: success() && steps.mobile-soak-trend-history.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .superpowers/visual-regression/mobile-device-soak/mobile-device-soak-trend-history.json
          key: mobile-soak-trend-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-${{ github.sha }}
      - name: Build map diagnostics provenance manifest
        run: pnpm maps:diagnostics-provenance -- --sha "${{ github.sha }}" --run-id "${{ github.run_id }}" --repository "${{ github.repository }}"
      - name: Verify diagnostics provenance subjects
        run: pnpm maps:diagnostics-provenance-verify
      - name: Build one-click diagnostics Evidence Pack
        run: pnpm maps:diagnostics-evidence-pack
      - name: Verify diagnostics Evidence Pack offline
        run: pnpm maps:diagnostics-evidence-pack-verify
      - name: Sign map diagnostics Evidence Pack with GitHub OIDC
        id: diagnostics-attestation
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@v4
        with:
          subject-path: .superpowers/visual-regression/map-diagnostics-evidence-pack.tgz
      - name: Verify signed diagnostics provenance
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify .superpowers/visual-regression/map-diagnostics-evidence-pack.tgz --repo "${{ github.repository }}" --signer-workflow "${{ github.repository }}/.github/workflows/visual-regression.yml"
      - name: Bundle offline signature verification material
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.diagnostics-attestation.outputs.bundle-path }}" .superpowers/visual-regression/map-diagnostics-attestation.json
          gh attestation trusted-root > .superpowers/visual-regression/trusted_root.jsonl
          gh attestation verify .superpowers/visual-regression/map-diagnostics-evidence-pack.tgz --repo "${{ github.repository }}" --signer-workflow "${{ github.repository }}/.github/workflows/visual-regression.yml" --bundle .superpowers/visual-regression/map-diagnostics-attestation.json --custom-trusted-root .superpowers/visual-regression/trusted_root.jsonl
      - name: Summarize diagnostics provenance
        if: always() && hashFiles('.superpowers/visual-regression/map-diagnostics-provenance.json') != ''
        run: pnpm maps:diagnostics-provenance-summary -- --attestation-url "${{ steps.diagnostics-attestation.outputs.attestation-url }}" --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Package content-addressed browser quality evidence
        if: always()
        run: |
          node scripts/pack-content-addressed-quality-evidence.mjs --input-dir .superpowers/visual-regression/mobile-hud-browser --output-dir .quality-artifacts/mobile-hud-browser --exclude-suffix=-diff.png
          node scripts/pack-content-addressed-quality-evidence.mjs --input-dir .superpowers/visual-regression/mobile-device-soak --output-dir .quality-artifacts/mobile-device-soak --exclude-suffix=-trace.zip
          node scripts/pack-content-addressed-quality-evidence.mjs --input-dir .superpowers/visual-regression/map-diagnostics-browser --output-dir .quality-artifacts/map-diagnostics-browser
      - name: Upload visual region report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-visual-region-report-${{ github.run_id }}
          path: .superpowers/visual-regression/mobile-game-regions.json
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 30
      - name: Upload signed diagnostics Evidence Pack
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: map-diagnostics-evidence-pack-${{ github.run_id }}
          path: |
            .superpowers/visual-regression/map-diagnostics-evidence-pack.tgz
            .superpowers/visual-regression/map-diagnostics-evidence-pack-VERIFY.md
            .superpowers/visual-regression/map-diagnostics-attestation.json
            .superpowers/visual-regression/trusted_root.jsonl
            .superpowers/visual-regression/map-diagnostics-provenance.json
            .superpowers/visual-regression/map-diagnostics-provenance.md
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload visual difference
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-visual-regression-${{ github.run_id }}
          path: |
            .superpowers/visual-regression/mobile-game-diff.png
            .superpowers/visual-regression/mobile-hud-browser/**/*-diff.png
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 14
      - name: Upload world layout report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-layout-region-report-${{ github.run_id }}
          path: |
            .superpowers/visual-regression/world-layout-regions.json
            .superpowers/visual-regression/world-geometry-policy-report.json
            .superpowers/visual-regression/world-geometry-policy-history.json
            .superpowers/visual-regression/world-geometry-policy-tuning.json
            .superpowers/visual-regression/world-geometry-policy-tuning.html
            .superpowers/visual-regression/world-geometry-policy-governance.json
            .superpowers/visual-regression/world-geometry-policy-review-state.json
            .superpowers/visual-regression/world-geometry-policy-pr-summary.md
            .superpowers/visual-regression/world-geometry-policy-issue.json
            .superpowers/visual-regression/world-geometry-policy-issue.md
            .superpowers/visual-regression/map-diagnostics-provenance.json
            .superpowers/visual-regression/map-diagnostics-provenance.md
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload world layout difference
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: world-layout-regression-${{ github.run_id }}
          path: |
            .superpowers/visual-regression/world-layout-current.png
            .superpowers/visual-regression/world-layout-diff.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload mobile HUD browser audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-hud-browser-${{ github.run_id }}
          path: |
            .quality-artifacts/mobile-hud-browser
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 7
      - name: Upload mobile device soak audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-device-soak-${{ github.run_id }}
          path: |
            .quality-artifacts/mobile-device-soak
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 7
      - name: Upload short-lived mobile performance traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-device-traces-${{ github.run_id }}
          path: .superpowers/visual-regression/mobile-device-soak/*-trace.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - name: Upload map diagnostics browser audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: map-diagnostics-browser-${{ github.run_id }}
          path: .quality-artifacts/map-diagnostics-browser
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 7
      - name: Upload map foreground diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: map-foreground-diagnostics-${{ github.run_id }}
          path: |
            .superpowers/visual-regression/map-foreground-audit.png
            .superpowers/visual-regression/map-foreground-audit.json
            .superpowers/visual-regression/map-foreground-suggestions.json
            .superpowers/visual-regression/map-foreground-suggestions.patch.json
            .superpowers/visual-regression/map-foreground-rollback.patch.json
            .superpowers/visual-regression/map-foreground-depth-history.json
            .superpowers/visual-regression/map-foreground-depth-trend.json
            .superpowers/visual-regression/map-foreground-depth-trend.md
            .superpowers/visual-regression/map-foreground-depth-trend.html
            .superpowers/visual-regression/map-foreground-pr-summary.md
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 7
      - name: Comment map foreground diagnostics on the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const summaryPaths = [
              ".superpowers/visual-regression/game-resource-budget/pwa-cache-asset-delta.md",
              ".superpowers/visual-regression/map-foreground-pr-summary.md",
              ".superpowers/visual-regression/world-geometry-policy-pr-summary.md",
              ".superpowers/visual-regression/map-diagnostics-provenance.md"
            ];
            const body = summaryPaths.filter((summaryPath) => fs.existsSync(summaryPath))
              .map((summaryPath) => fs.readFileSync(summaryPath, "utf8").trim())
              .join("\n\n");
            if (!body) return;
            const marker = "<!-- map-foreground-diagnostics -->";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find((comment) => comment.user?.type === "Bot" && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
