name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Verify Pages build environment
        run: test -n "$VITE_WORKER_URL"
        env:
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
      - run: pnpm build
        env:
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
          VITE_INVITATION_ID: ${{ vars.VITE_INVITATION_ID || 'sample-garden' }}
      - name: Restore Playwright browser cache
        id: playwright-browser-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-1.62.0
      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium
      - name: Install Chromium on cache miss
        if: steps.playwright-browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Verify game CSS and font request budgets
        run: pnpm performance:resource-budget
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: client/dist
      - uses: actions/deploy-pages@v5
