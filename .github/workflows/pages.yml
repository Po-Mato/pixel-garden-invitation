name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore shared quality dependencies
        id: quality-dependencies
        uses: ./.github/actions/setup-quality-dependencies
        with:
          node-version: 24
      - run: pnpm test
      - name: Verify Pages build environment
        run: test -n "$VITE_WORKER_URL"
        env:
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
      - name: Restore commit-matched production build
        id: quality-build
        uses: ./.github/actions/restore-quality-build
        with:
          variant: production
          target-sha: ${{ github.sha }}
          github-token: ${{ github.token }}
      - name: Mark local Pages fallback build start
        id: local-quality-build-start
        if: steps.quality-build.outputs.restored != 'true'
        run: echo "started-at-ms=$(node -p 'Date.now()')" >> "$GITHUB_OUTPUT"
      - name: Build locally when shared artifact is unavailable
        if: steps.quality-build.outputs.restored != 'true'
        run: pnpm build
        env:
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
          VITE_INVITATION_ID: ${{ vars.VITE_INVITATION_ID || 'sample-garden' }}
      - name: Report Pages quality CI efficiency
        if: always()
        uses: ./.github/actions/report-quality-ci-efficiency
        with:
          workflow: pages
          variant: production
          dependency-cache-hit: ${{ steps.quality-dependencies.outputs.cache-hit || 'false' }}
          dependency-setup-duration-ms: ${{ steps.quality-dependencies.outputs.setup-duration-ms || '0' }}
          build-restored: ${{ steps.quality-build.outputs.restored || 'false' }}
          restore-duration-ms: ${{ steps.quality-build.outputs.restore-duration-ms || '0' }}
          artifact-bytes: ${{ steps.quality-build.outputs.artifact-bytes || '0' }}
          producer-build-duration-ms: ${{ steps.quality-build.outputs.producer-build-duration-ms || '0' }}
          fallback-started-at-ms: ${{ steps.local-quality-build-start.outputs.started-at-ms || '0' }}
      - name: Restore Playwright browser cache
        id: playwright-browser-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-1.62.0
      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium
      - name: Install Chromium on cache miss
        if: steps.playwright-browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Restore public PWA deployment trend
        uses: actions/cache/restore@v5
        with:
          path: .superpowers/visual-regression/production-network-pwa-canary/production-network-pwa-trend-history.json
          key: production-network-pwa-trend-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            production-network-pwa-trend-${{ runner.os }}-
      - name: Seed public PWA trend from recent successful Pages artifacts
        run: node scripts/seed-production-network-pwa-trend-history.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Restore PWA cache asset history
        uses: actions/cache/restore@v5
        with:
          path: .superpowers/visual-regression/game-resource-budget/pwa-cache-asset-trend-history.json
          key: pwa-cache-assets-${{ runner.os }}-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pwa-cache-assets-${{ runner.os }}-main-
      - name: Verify game CSS and font request budgets
        run: pnpm performance:resource-budget
        env:
          PWA_CACHE_BASELINE_URL: https://po-mato.github.io/pixel-garden-invitation/
      - name: Verify fresh-install offline invitation journey
        run: pnpm pwa:clean-install-canary
      - name: Verify service worker replacement and cache rollback
        run: pnpm pwa:update-rollback-canary
      - name: Preserve the current public service worker before deployment
        run: pnpm quality:production-network-pwa -- --phase prepare --url "$PAGES_URL" --profile-dir "$RUNNER_TEMP/production-network-pwa-profile"
        env:
          PAGES_URL: https://po-mato.github.io/pixel-garden-invitation/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: client/dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify Pages base path and service worker scope contract
        run: pnpm quality:pages-runtime-contract -- --url "$PAGES_URL" --expected-sha "$GITHUB_SHA" --expected-base-path /pixel-garden-invitation/
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
      - name: Verify public 320px 200% portrait and landscape journey
        run: pnpm quality:production-large-text -- --url "$PAGES_URL" --expected-sha "$GITHUB_SHA"
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
      - name: Verify slow 4G cold start and public service worker replacement
        run: pnpm quality:production-network-pwa -- --phase verify --url "$PAGES_URL" --expected-sha "$GITHUB_SHA" --profile-dir "$RUNNER_TEMP/production-network-pwa-profile"
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
      - name: Save public PWA deployment trend
        if: ${{ always() && hashFiles('.superpowers/visual-regression/production-network-pwa-canary/production-network-pwa-trend-history.json') != '' }}
        uses: actions/cache/save@v5
        with:
          path: .superpowers/visual-regression/production-network-pwa-canary/production-network-pwa-trend-history.json
          key: production-network-pwa-trend-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save successful PWA cache asset history
        if: ${{ success() && hashFiles('.superpowers/visual-regression/game-resource-budget/pwa-cache-asset-trend-history.json') != '' }}
        uses: actions/cache/save@v5
        with:
          path: .superpowers/visual-regression/game-resource-budget/pwa-cache-asset-trend-history.json
          key: pwa-cache-assets-${{ runner.os }}-main-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Package content-addressed Pages quality evidence
        if: always()
        run: |
          node scripts/pack-content-addressed-quality-evidence.mjs --input-dir .superpowers/visual-regression/production-large-text-canary --output-dir .quality-artifacts/production-large-text-canary
          node scripts/pack-content-addressed-quality-evidence.mjs --input-dir .superpowers/visual-regression/production-network-pwa-canary --output-dir .quality-artifacts/production-network-pwa-canary
          node scripts/pack-content-addressed-quality-evidence.mjs --input-dir .superpowers/visual-regression/game-resource-budget --output-dir .quality-artifacts/game-resource-budget
      - name: Upload public large-text canary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-large-text-canary
          path: .quality-artifacts/production-large-text-canary
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 9
          retention-days: 7
      - name: Upload public slow 4G and PWA update evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-network-pwa-canary
          path: .quality-artifacts/production-network-pwa-canary
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 9
          retention-days: 7
      - name: Upload PWA cache asset change report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pwa-cache-asset-change
          path: .quality-artifacts/game-resource-budget
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 9
          retention-days: 30
