<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>9번 정확한 3등신 검수</title><style>*{box-sizing:border-box}body{font:15px system-ui;margin:12px;background:#eee8de;color:#25334b}body.dark{background:#29313a;color:#fff}h1{font-size:21px}p{line-height:1.5}.controls{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}button,select{font:inherit;padding:10px}.sizes{display:flex;gap:8px;align-items:end;flex-wrap:wrap}figure{margin:0}figcaption{font-size:12px}img{display:block}.all{display:flex;gap:24px;margin-top:12px}.guides{background:linear-gradient(transparent 18.75%,#e3828240 18.75% 43.75%,#88a3cc40 43.75% 93.75%,transparent 93.75%)}</style><h1>9번 · 72 / 144 / 216px</h1><p>원본 리그 재출력 후보. 실제 게임 통합·운영 배포 아님.</p><div class="controls"><label>방향 <select id="direction"><option value="front">정면</option><option value="left">왼쪽</option><option value="right">오른쪽</option><option value="back">후면</option></select></label><button id="play">재생</button><button id="stop">정지</button><button id="dark">배경 전환</button><button id="guide">비율선</button></div><div class="sizes"><figure><img id="hd" width="192" height="288" alt="고해상도"><figcaption>192×288</figcaption></figure><figure><img id="selection" width="96" height="144" alt="선택 크기"><figcaption>96×144</figcaption></figure><figure><img id="game" width="48" height="72" alt="게임 크기"><figcaption>48×72</figcaption></figure></div><p id="state"></p><div class="controls"><button data-step="1">1번</button><button data-step="2">2번</button><button data-step="3">3번</button><button data-step="4">4번</button></div><p>네 방향 동시 비교 · 게임 크기</p><div class="all"><img data-direction="front" width="48" height="72" alt="front"><img data-direction="left" width="48" height="72" alt="left"><img data-direction="right" width="48" height="72" alt="right"><img data-direction="back" width="48" height="72" alt="back"></div><script>let frame=2,timer;function draw(){const direction=document.getElementById('direction').value;for(const id of ['hd','selection','game'])document.getElementById(id).src='../generated/'+direction+'/frame-'+frame+'.png';for(const img of document.querySelectorAll('[data-direction]'))img.src='../generated/'+img.dataset.direction+'/frame-'+frame+'.png';document.body.dataset.frame=frame;document.body.dataset.direction=direction;document.getElementById('state').textContent=frame+'번 프레임'}function stop(){clearInterval(timer);timer=null}document.getElementById('play').onclick=()=>{stop();timer=setInterval(()=>{frame=frame%4+1;draw()},240)};document.getElementById('stop').onclick=()=>{stop();frame=2;draw()};document.getElementById('direction').onchange=draw;document.getElementById('dark').onclick=()=>document.body.classList.toggle('dark');document.getElementById('guide').onclick=()=>document.getElementById('hd').classList.toggle('guides');for(const b of document.querySelectorAll('[data-step]'))b.onclick=()=>{stop();frame=+b.dataset.step;draw()};draw();</script></html>
