<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>5번 원본 리그 정면 검수</title>
<style>*{box-sizing:border-box}body{margin:0;padding:20px;font:14px/1.6 system-ui;background:#f8f4ec;color:#343c32}main{max-width:760px;margin:auto}h1{font-size:22px}p{margin:8px 0 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}figure{margin:0;border:1px solid #d5dace;border-radius:12px;text-align:center;background:white;overflow:hidden}figcaption{padding:8px;font-size:12px}.stage{height:300px;display:flex;align-items:end;justify-content:center;background:var(--stage,#c7d7bd)}.stage img{flex:none;object-fit:contain}.size{height:156px}.ref{display:block;width:100%;height:300px;object-fit:contain}button{min-height:44px;padding:6px 14px;margin:0 8px 12px 0;border:1px solid #839078;border-radius:8px;background:white;color:#303c2c}.note{color:#73503b}section{margin:20px 0}a{color:#385331}</style>
<main><h1>5번 · 정면 원본 조립 검수</h1><p class="note">공용 보행 첫 검수 · 운영 미반영 · 측면과 후면은 아직 미구현</p><div><button data-bg="#c7d7bd">밝은 맵</button><button data-bg="#263545">어두운 맵</button><button data-bg="#fff9ee">크림 배경</button></div><div><button id="play" aria-pressed="false">보행 재생</button><button data-frame="0">1번</button><button data-frame="1">중립</button><button data-frame="2">3번</button><button data-frame="3">4번</button></div><p id="frame-status" aria-live="polite">중립 자세</p>
<div class="grid"><figure><img class="ref" src="../storybook-concept-v1/front-concept.png" alt="승인된 디자인 참고안"><figcaption>승인 참고안 · 전체 그림</figcaption></figure><figure><div class="stage"><img src="generated/front-neutral-192x288.png" width="192" height="288" alt="공용 골격 정면 조립본"></div><figcaption>192×288 · 원본 자동 렌더</figcaption></figure></div>
<section class="grid"><figure><div class="stage size"><img src="generated/front-neutral-96x144.png" width="96" height="144" alt="선택 화면 실제 크기"></div><figcaption>96×144 · 선택 표시</figcaption></figure><figure><div class="stage size"><img src="generated/front-neutral-48x72.png" width="48" height="72" alt="게임 화면 실제 크기"></div><figcaption>48×72 · 게임 표시</figcaption></figure></section>
<p>좌우 팔·다리는 독립 원화이며 가방은 착용자 왼손에 연결됩니다. 공용 원피스 보행을 사용합니다. 방향 일관성·실제 게임 UI 검수는 이 자료로 통과 처리하지 않습니다.</p><a href="generated/background-review.png">배경별 확대 검수</a></main>
<script>
document.querySelectorAll('[data-bg]').forEach(button=>button.addEventListener('click',()=>document.documentElement.style.setProperty('--stage',button.dataset.bg)));
let timer=null,frame=1;const play=document.querySelector('#play');const status=document.querySelector('#frame-status');
const show=n=>{frame=n;document.querySelectorAll('.stage img').forEach(img=>img.src=`generated/front-walk-${n+1}.png`);status.textContent=`${n+1}번 프레임 · ${['왼발 전진','중립','오른발 전진','중립'][n]}`;};
const stop=()=>{clearInterval(timer);timer=null;play.textContent='보행 재생';play.setAttribute('aria-pressed','false');};
play.addEventListener('click',()=>{if(timer){stop();return;}play.textContent='보행 정지';play.setAttribute('aria-pressed','true');timer=setInterval(()=>show((frame+1)%4),180);});
document.querySelectorAll('[data-frame]').forEach(button=>button.addEventListener('click',()=>{stop();show(Number(button.dataset.frame));}));
</script></html>
