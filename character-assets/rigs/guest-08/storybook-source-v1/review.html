<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>8번 네 방향 원본 리그 연구</title>
<style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#f8f4ec;color:#343c32;font:14px/1.6 system-ui}main{max-width:860px;margin:auto}h1{font-size:22px}button{min-height:44px;margin:0 6px 8px 0;padding:8px 14px;border:1px solid #839078;border-radius:8px;background:white;color:inherit}button[aria-pressed=true]{background:#d4dfc9}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}figure{margin:0;text-align:center;border:1px solid #bfc8b8;border-radius:10px;overflow:hidden}figcaption{padding:8px}.stage{background:var(--bg,#c7d7bd);height:300px;display:flex;justify-content:center;align-items:end}.stage img{flex:none}.small{height:160px}.reference{width:100%;max-height:320px;object-fit:contain}.note{color:#73503b}a{color:#385331}section{margin:18px 0}</style>
<main><h1>8번 · 네 방향 원본 리그</h1><p class="note">제작 중 · 운영 미반영. 더스티로즈 의상·가는 팔·허리 매듭 검수 중. 원본 레이어 분리와 보행 출력 연구입니다. 최종 시각·실제 UI 검수는 아직 완료되지 않았습니다.</p>
<div id="directions"><button data-direction="front" aria-pressed="true">정면</button><button data-direction="left" aria-pressed="false">왼쪽</button><button data-direction="right" aria-pressed="false">오른쪽</button><button data-direction="back" aria-pressed="false">후면</button></div>
<div><button id="play" aria-pressed="false">보행 재생</button><button data-frame="0">1번</button><button data-frame="1">중립 2번</button><button data-frame="2">3번</button><button data-frame="3">중립 4번</button></div>
<div><button data-bg="#c7d7bd">밝은 맵</button><button data-bg="#263545">어두운 맵</button><button data-bg="#fff9ee">크림 배경</button></div><p id="status" aria-live="polite">정면 · 2번</p>
<div class="grid"><figure><img class="reference" src="../../guest-05/storybook-concept-v1/front-concept.png" alt="승인된 정면 디자인 참고안"><figcaption>5번 승인 스타일 기준</figcaption></figure><figure><div class="stage"><img class="character" src="generated/front-walk-2.png" width="192" height="288" alt="고해상도 원본 렌더"></div><figcaption>192×288</figcaption></figure></div>
<section class="grid"><figure><div class="stage small"><img class="character" src="generated/front-walk-2.png" width="96" height="144" alt="선택 화면 표시 크기"></div><figcaption>선택 96×144</figcaption></figure><figure><div class="stage small"><img class="character" src="generated/front-walk-2.png" width="48" height="72" alt="게임 표시 크기"></div><figcaption>게임 48×72</figcaption></figure></section>
<p>머리 72 · 몸 144 · 전체 216px 공용 골격. 2·4번은 같은 중립 자세입니다. 실제 선택 화면·맵·서비스 워커 검증을 이 연구 페이지로 대신하지 않습니다.</p><a href="generated/walk-study.png">네 방향 16프레임 검수표</a></main>
<script>
let direction='front',frame=1,timer=null;const names={front:'정면',left:'왼쪽',right:'오른쪽',back:'후면'},play=document.querySelector('#play');
const show=()=>{const folder='generated';document.querySelectorAll('.character').forEach(img=>img.src=`${folder}/${direction}-walk-${frame+1}.png`);document.querySelector('#status').textContent=`${names[direction]} · ${frame+1}번`;};
const stop=()=>{clearInterval(timer);timer=null;play.textContent='보행 재생';play.setAttribute('aria-pressed','false');};
play.onclick=()=>{if(timer){stop();return;}play.textContent='보행 정지';play.setAttribute('aria-pressed','true');timer=setInterval(()=>{frame=(frame+1)%4;show();},180);};
document.querySelectorAll('[data-direction]').forEach(b=>b.onclick=()=>{direction=b.dataset.direction;document.querySelectorAll('[data-direction]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));show();});
document.querySelectorAll('[data-frame]').forEach(b=>b.onclick=()=>{stop();frame=Number(b.dataset.frame);show();});
document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>document.documentElement.style.setProperty('--bg',b.dataset.bg));
</script></html>
